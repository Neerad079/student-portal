<!DOCTYPE html>
<html>
    <head>
        <title>student registration</title>
        <meta charset = "UTF-8" >
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="register.css">
    </head>
    
    
    <body>
        <main>
            <section>
                <h1 >Registration Form</h1>
            </section>
            <form>
                <div>
                <label for="name">Name: </label>
                <br>
                <input type="text" id="name" placeholder = "John" name="username" required >
            </div>
            <br>
            <div>
                <label for="roll_no">Enrollment no. :</label>
                <br>
                <input type="text" id="roll_no" placeholder = "2024BCSE086" name="roll_no" required>
            </div>
            <br>
            <div>
                <label for="email">Email :</label>
                <br>
                <input type="email" id="email" placeholder="abc@gmail.com" name="email" required>
            </div>
            <br>
            <div> 
                <label for="pass" >Password :  </label>
                <br>
                <input type="password" id="pass" name="password" required>
            </div>
            <br>
            <div>
                <label for="reenter">ReType Password :</label>
                <br>
                <input type="password" id="reenter" name ="confirmPassword" required>
            </div>
            <br>
            <div>
                <button>Submit</button>
            </div>
            </form>
            
            <p>Already have an account? 
            <a href="Login.html" target="_blank">
                Login
            </a>
            </p>
        </main>
    <script src="register.js"></script>
    </body>

</html>
